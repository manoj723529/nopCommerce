apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: 772217230642.dkr.ecr.eu-north-1.amazonaws.com/dev/nop:latest
        ports:
        - containerPort: 80